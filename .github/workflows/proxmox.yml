name: Proxmox Managed by Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/live/proxmox/**"
      - "modules/proxmox-vm/**"
      - "modules/proxmox-lxc/**"
      - ".github/workflows/proxmox.yml"

  pull_request:
    branches: [main]
    paths:
      - "infra/live/proxmox/**"
      - "modules/proxmox-vm/**"
      - "modules/proxmox-lxc/**"
      - ".github/workflows/proxmox.yml"

  workflow_dispatch:
    inputs:
      apply:
        description: "Executar terraform apply?"
        required: true
        type: boolean
        default: false

concurrency:
  group: proxmox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, ci-proxy]
    defaults:
      run:
        working-directory: infra/live/proxmox
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_proxmox_api_url: "https://192.168.15.199:8006/"
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
        run: terraform plan -out=plan.out

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-proxmox-${{ github.sha }}
          path: infra/live/proxmox/plan.out

  apply:
    name: Apply
    runs-on: [self-hosted, ci-proxy]
    needs: [plan]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.apply == true)
    concurrency:
      group: proxmox-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/live/proxmox
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform init
        run: terraform init -input=false

      - name: Setup SSH key for Proxmox
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ACTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 192.168.15.199 >> ~/.ssh/known_hosts
          ssh-keyscan -H 192.168.15.198 >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-proxmox-${{ github.sha }}
          path: infra/live/proxmox

      - name: Terraform apply (from plan)
        env:
          TF_VAR_proxmox_api_url: "https://192.168.15.199:8006/"
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_proxmox_ssh_host: "192.168.15.199"
          TF_VAR_proxmox_ssh_host_b: "192.168.15.198"
          TF_VAR_vm_password_hash: ${{ secrets.PROXMOX_VM_PASSWORD_HASH }}
        run: terraform apply -auto-approve plan.out
